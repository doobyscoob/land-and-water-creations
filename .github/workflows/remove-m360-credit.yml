name: Remove M360 dependencies

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/remove-m360-credit.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Remove Marketing 360 references and localize mirrored assets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          credit = re.compile(r'\s*<div class="scCredit"><a href="https://www\.marketing360\.com\?ref=sitereferral" target="_blank" rel="nofollow">Created with <span>Marketing 360</span></a></div>')
          text_exts = {".html",".css",".js",".txt",".xml",".json",".svg"}
          changed = 0
          for path in Path("site").rglob("*"):
              if not path.is_file() or path.suffix.lower() not in text_exts:
                  continue
              try:
                  text = path.read_text(encoding="utf-8")
              except UnicodeDecodeError:
                  continue
              new = credit.sub("", text)
              new = new.replace("https://static.mywebsites360.com", "")
              new = new.replace("http://static.mywebsites360.com", "")
              if new != text:
                  path.write_text(new, encoding="utf-8")
                  changed += 1
          print(f"Updated {changed} files")
          PY

      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site
          git commit -m "Remove remaining M360 dependencies" || exit 0
          git push
